<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXEL — The Next Edge</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:Montserrat,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:28px 40px;
  font-size:13px;
  letter-spacing:0.18em;
  font-weight:500;
}
nav{display:flex;gap:36px;align-items:center}
nav a{color:#fff;text-decoration:none}
.right-nav{display:flex;align-items:center;gap:28px}
.grid-icon{display:grid;grid-template-columns:repeat(3,4px);gap:3px}
.grid-icon span{width:4px;height:4px;background:#fff;border-radius:50%}
main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.logo-a{width:92px;margin-bottom:22px}
.brand{
  font-size:88px;
  font-weight:500;
  letter-spacing:0.22em;
  margin-bottom:14px;
  line-height:1;
}
.tag{
  font-size:12px;
  letter-spacing:0.62em;
  margin-bottom:48px;
  font-weight:400;
}
.btn{
  border:1px solid rgba(255,255,255,0.85);
  padding:14px 46px;
  letter-spacing:0.36em;
  font-size:13px;
  text-decoration:none;
  color:#fff;
  transition:0.25s;
}
.btn:hover{background:#fff;color:#000}
</style>
</head>
<body>
<header>
  <nav>
    <a href="#">AXEL</a>
    <a href="#">PRODUCT</a>
    <a href="#">TECHNOLOGY</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT</a>
  </nav>
  <div class="right-nav">
    <a href="#">SIGN IN</a>
    <div class="grid-icon">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<main>
  <!-- Logo A (with bridge) -->
  <svg class="logo-a" viewBox="0 0 120 110">
    <polygon points="60,6 22,104 38,104 60,48 82,104 98,104" fill="#fff"/>
    <rect x="46" y="62" width="28" height="9" fill="#000"/>
  </svg>

  <!-- AXEL — open A + disconnected E -->
  <div class="brand">AXEL</div>

  <div class="tag">THE NEXT EDGE</div>
  <a href="#" class="btn">ENTER</a>
</main>
</body>
</html>
