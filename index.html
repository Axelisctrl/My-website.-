<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXEL — The Next Edge</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:'Montserrat',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:32px 48px 0;
  font-size:12px;
  letter-spacing:0.22em;
  font-weight:500;
}
nav{display:flex;gap:42px}
nav a{color:#fff;text-decoration:none}
.right{display:flex;align-items:center;gap:32px}
.dots{display:grid;grid-template-columns:repeat(3,5px);gap:4px}
.dots span{width:5px;height:5px;background:#fff;border-radius:50%}
main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-bottom:40px;
}
.logo{width:100px;margin-bottom:28px}
.brand{
  font-size:92px;
  font-weight:500;
  letter-spacing:0.28em;
  margin-bottom:18px;
  line-height:0.85;
}
.tag{
  font-size:11px;
  letter-spacing:0.68em;
  margin-bottom:52px;
  font-weight:400;
}
.btn{
  border:1px solid rgba(255,255,255,0.9);
  padding:15px 52px;
  font-size:12px;
  letter-spacing:0.42em;
  text-decoration:none;
  color:#fff;
  transition:0.25s;
}
.btn:hover{background:#fff;color:#000}
</style>
</head>
<body>
<header>
  <nav>
    <a href="#">AXEL</a>
    <a href="#">PRODUCT</a>
    <a href="#">TECHNOLOGY</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT</a>
  </nav>
  <div class="right">
    <a href="#">SIGN IN</a>
    <div class="dots">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<main>
  <!-- Logo A with bridge -->
  <svg class="logo" viewBox="0 0 140 120">
    <polygon points="70,8 26,112 44,112 70,52 96,112 114,112" fill="#fff"/>
    <rect x="52" y="68" width="36" height="11" fill="#000"/>
  </svg>

  <!-- AXEL with open A and disconnected E style -->
  <div class="brand">AXEL</div>

  <div class="tag">THE NEXT EDGE</div>
  <a href="#" class="btn">ENTER</a>
</main>
</body>
</html>
